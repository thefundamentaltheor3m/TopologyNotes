# Removes a closed pull request's PDF preview from the Pages site.
#
# The cleanup itself lives in Lecture-Notes-Template-2026, alongside the build
# that creates the preview; this file only supplies the trigger.

name: Remove PR preview

on:
  pull_request:
    types: [ closed ]

permissions:
  contents: read

jobs:
  cleanup:
    uses: thefundamentaltheor3m/Lecture-Notes-Template-2026/.github/workflows/latex-preview-cleanup.yml@main
    permissions:
      contents: write
      pull-requests: write
